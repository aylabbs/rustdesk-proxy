<!DOCTYPE html>
<html>
  <head>
    <title>Download Rustdesk</title>
  </head>
  <body>
    <button id="downloadBtn">Download Rustdesk</button>

    <script>
      async function downloadRustDesk() {
        try {
          // call Netlify Function
          location.href = "/.netlify/functions/hello";
        } catch (err) {
          console.error("Download failed:", err);
        }
      }
      document.addEventListener("DOMContentLoaded", async () => {
        downloadRustDesk();
      });
      document
        .getElementById("downloadBtn")
        .addEventListener("click", downloadRustDesk);
    </script>
  </body>
</html>
